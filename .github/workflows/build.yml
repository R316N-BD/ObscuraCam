name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to move the latest-debug tag and upload release assets.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compute SHA-256 checksums
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          echo '### APK checksums' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: obscuracam-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt

      # Rolling pre-release: a stable, sign-in-free download link that always points at the
      # newest successful push build:
      #   https://github.com/<owner>/<repo>/releases/download/latest-debug/ObscuraCam-debug.apk
      # Skipped for pull requests so untrusted branches can't publish.
      - name: Publish latest-debug pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ObscuraCam-debug.apk
          sha256sum ObscuraCam-debug.apk | tee ObscuraCam-debug.apk.sha256
          SHA256=$(cut -d' ' -f1 ObscuraCam-debug.apk.sha256)

          # Point the tag at this commit (tags pushed with GITHUB_TOKEN don't re-trigger CI).
          git tag -f latest-debug
          git push -f origin refs/tags/latest-debug

          NOTES="Test build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, built $(date -u +'%Y-%m-%d %H:%M UTC').

          Debug-signed: uninstall any F-Droid/Play ObscuraCam first.

          SHA-256: \`${SHA256}\`"

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release edit latest-debug --prerelease --title "Latest test build" --notes "$NOTES"
          else
            gh release create latest-debug --prerelease --title "Latest test build" --notes "$NOTES"
          fi
          gh release upload latest-debug ObscuraCam-debug.apk ObscuraCam-debug.apk.sha256 --clobber
