apply plugin: 'com.android.application'

android {
    namespace 'org.witness.sscphase1'
    compileSdk 35

    defaultConfig {
        applicationId "org.witness.sscphase1"
        minSdkVersion 21
        // Android 14+ blocks installing/auto-updating apps that target very old SDKs (#149).
        targetSdkVersion 35
        versionCode 5012
        versionName "5.0.0-beta-2"
        multiDexEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    // Module name, STL and C++ exceptions are configured in Android.mk / Application.mk.
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    lint {
        disable 'MissingTranslation', 'LocaleFolder'
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.guava:guava:24.1-jre'
    implementation 'commons-codec:commons-codec:1.10'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.github.MasayukiSuda:GPUVideo-android:81741413bb'
    implementation 'org.apache.directory.studio:org.apache.commons.io:2.4'
}
